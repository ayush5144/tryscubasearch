<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact — ScubaSearch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #4338ca; --blue-hover: #3730a3;
      --teal-light: rgba(71,230,225,0.12);
      --dark: #242843; --muted: #64748b;
      --border: #e2e8f0; --bg: #ffffff;
    }
    body { font-family: 'Inter', sans-serif; color: var(--dark); background: var(--bg); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
    a { color: var(--blue); text-decoration: none; }
    a:hover { text-decoration: underline; }

    header { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,0.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
    .header-inner { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { font-weight: 700; font-size: 1.1rem; color: var(--dark); text-decoration: none; }
    .header-link { font-size: 0.875rem; font-weight: 500; color: var(--muted); }
    .header-link:hover { color: var(--blue); text-decoration: none; }

    main { flex: 1; }

    .hero { background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(114,246,252,0.2) 0%, transparent 70%); padding: 4rem 1.5rem 3rem; text-align: center; }
    .hero-badge { display: inline-block; background: var(--teal-light); border: 1px solid rgba(71,230,225,0.3); color: #0e8a87; font-size: 0.75rem; font-weight: 600; letter-spacing: 0.05em; padding: 0.3rem 0.9rem; border-radius: 999px; margin-bottom: 1.25rem; }
    .hero h1 { font-size: clamp(1.75rem, 4vw, 2.25rem); font-weight: 700; color: var(--dark); margin-bottom: 0.75rem; }
    .hero p { font-size: 1rem; color: var(--muted); max-width: 480px; margin: 0 auto; }

    .content { max-width: 560px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }

    .contact-card { border: 1px solid var(--border); border-radius: 1rem; padding: 2rem; background: #fff; }
    .contact-card-icon { font-size: 1.5rem; margin-bottom: 0.75rem; }
    .contact-card h3 { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 0.5rem; }
    .contact-card p, .contact-card a { font-size: 0.95rem; color: var(--dark); font-weight: 500; }
    .contact-card .sub { font-size: 0.8rem; color: var(--muted); font-weight: 400; margin-top: 0.25rem; }
    .founder-line { margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); }

    footer { border-top: 1px solid var(--border); background: #fff; padding: 1.5rem; }
    .footer-bottom { max-width: 900px; margin: 0 auto; font-size: 0.75rem; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <a href="/" class="logo">ScubaSearch</a>
      <a href="/" class="header-link">← Back to home</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <span class="hero-badge">Get in touch</span>
      <h1>Contact</h1>
      <p>Reach out for support, questions, or anything else.</p>
    </section>

    <div class="content">
      <div class="contact-card">
        <div class="contact-card-icon">📧</div>
        <h3>Email</h3>
        <a href="mailto:hello@scubasearch.io">hello@scubasearch.io</a>
        <p class="sub">General enquiries, billing, support</p>
        <p class="founder-line">Founder — Ayush Patil</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <p style="font-weight:500;color:#64748b;">Ayush Patil</p>
      <a href="mailto:ayushpatil9977@gmail.com" style="display:block;margin-top:0.25rem;color:#64748b;">ayushpatil9977@gmail.com</a>
      <p style="margin-top:0.75rem;">&copy; <script>document.write(new Date().getFullYear())</script> ScubaSearch</p>
    </div>
  </footer>

</body>
</html>
