<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScubaSearch — Headless Test</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 60px;
      padding-bottom: 80px;
    }

    /* ── Search bar ─────────────────────────────────────── */
    .search-wrap {
      width: 520px;
      max-width: 90vw;
    }

    input[type="search"] {
      width: 100%;
      padding: 13px 18px;
      font-size: 16px;
      border: 1.5px solid #ddd;
      border-radius: 12px;
      outline: none;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: border-color 0.15s;
    }

    input[type="search"]:focus {
      border-color: #111;
    }

    /* ── Brand block ────────────────────────────────────── */
    .brand {
      margin-top: 32px;
      text-align: center;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #111;
    }

    .brand-desc {
      margin-top: 6px;
      font-size: 14px;
      color: #888;
      max-width: 420px;
      line-height: 1.5;
    }

    /* ── Results grid ───────────────────────────────────── */
    #results {
      margin-top: 40px;
      width: 880px;
      max-width: 92vw;
      display: none;
    }

    .results-meta {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
    }

    .result-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: #111;
      transition: box-shadow 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
    }

    .result-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }

    .result-card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: #f0f0f0;
      display: block;
    }

    .result-card .img-ph {
      width: 100%;
      aspect-ratio: 1;
      background: #ebebeb;
    }

    .result-card .card-info {
      padding: 10px 12px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .card-title {
      font-size: 13px;
      font-weight: 500;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-price {
      font-size: 13px;
      color: #555;
      margin-top: auto;
    }

    /* ── No results ─────────────────────────────────────── */
    .no-results {
      text-align: center;
      padding: 48px 0;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <!-- Search input -->
  <div class="search-wrap">
    <input type="search" placeholder="Search products..." />
  </div>

  <!-- Brand block -->
  <div class="brand">
    <div class="brand-name">scubasearch.io</div>
    <p class="brand-desc">
      AI-powered search for ecommerce stores. Paste one script tag and your store gets hybrid keyword + semantic search — no backend work needed.
    </p>
  </div>

  <!-- Results — rendered by headless event, not by widget dropdown -->
  <div id="results"></div>

  <!-- Widget in headless mode — no dropdown, just fires the event -->
  <script src="./src/widget.js"
    data-api-key="sk_live_SERVE_PY_INJECTS_THIS"
    data-api-base="SERVE_PY_INJECTS_THIS"
    data-headless="true">
  </script>

  <script>
    var resultsContainer = document.getElementById('results');
    var currentLogId = null;

    window.addEventListener('scubasearch:results', function(e) {
      var results = e.detail.results;
      var query   = e.detail.query;
      currentLogId = e.detail.log_id;

      resultsContainer.style.display = 'block';

      if (!results || results.length === 0) {
        resultsContainer.innerHTML = '<div class="no-results">No results for &ldquo;' + query + '&rdquo;</div>';
        return;
      }

      var meta = '<div class="results-meta">' + results.length + ' results for &ldquo;' + query + '&rdquo;' + (e.detail.cache_hit ? ' &middot; cached' : '') + '</div>';

      var cards = results.map(function(p) {
        var img = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + (p.title || '') + '" onerror="this.parentNode.replaceChild(Object.assign(document.createElement(\'div\'),{className:\'img-ph\'}),this)" />'
          : '<div class="img-ph"></div>';

        var price = p.price != null ? '<div class="card-price">\u20B9' + p.price + '</div>' : '';

        return (
          '<a class="result-card" href="' + (p.product_url || '#') + '" ' +
              'data-product-id="' + (p.id || '') + '">' +
            img +
            '<div class="card-info">' +
              '<div class="card-title">' + (p.title || '') + '</div>' +
              price +
            '</div>' +
          '</a>'
        );
      }).join('');

      resultsContainer.innerHTML = meta + '<div class="results-grid">' + cards + '</div>';

      // Signal engagement when user hovers a result card — tells the widget
      // this session should be classified as "browsed" not "abandoned"
      var cardEls = resultsContainer.querySelectorAll('.result-card');
      for (var i = 0; i < cardEls.length; i++) {
        cardEls[i].addEventListener('mouseenter', function() {
          if (window.ScubaSearch) window.ScubaSearch.engage();
        });
      }
    });

    // Click tracking — uses widget's built-in click() which also settles the session
    document.addEventListener('click', function(e) {
      var card = e.target.closest('.result-card');
      if (!card) return;
      var productId = card.getAttribute('data-product-id');
      if (!productId) return;
      if (window.ScubaSearch && window.ScubaSearch.click) {
        window.ScubaSearch.click(productId);
      }
    });
  </script>

</body>

</html>
