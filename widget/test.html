<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScubaSearch — Widget Test</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f9f9f9;
      color: #111;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 80px;
      gap: 12px;
    }

    .label {
      font-size: 13px;
      color: #999;
      letter-spacing: 0.3px;
    }

    .search-wrap {
      width: 480px;
      max-width: 90vw;
      position: relative;
    }

    input[type="search"] {
      width: 100%;
      padding: 12px 16px;
      font-size: 16px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      outline: none;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: border-color 0.15s;
    }

    input[type="search"]:focus {
      border-color: #111;
    }
  </style>
</head>

<body>

  <span class="label">ScubaSearch widget test</span>

  <div class="search-wrap">
    <input type="search" placeholder="Search products..." />
  </div>

  <script src="./src/widget.js" data-api-key="sk_live_SERVE_PY_INJECTS_THIS" data-api-base="SERVE_PY_INJECTS_THIS"
    data-placeholder="Search products..." data-layout="grid" data-semantic-ratio="0.50" data-attached="false"
    data-radius="0">
    </script>

</body>

</html>
